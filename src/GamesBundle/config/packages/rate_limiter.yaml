framework:
    rate_limiter:
        # Status reads of a game profile that skip the caches (ProfileStatusRefreshLimiter: "Refresh" on the site and,
        # later, in the bot), per user and profile. One read is the notes, the check-in and one call per endgame mode
        games_status_refresh:
            policy: sliding_window
            limit: 3
            interval: '10 minutes'
        # Shareable pulls cards (PullCardLimiter), per user: each one keeps the headless browser of node-services busy
        # for a few seconds. Room for trying the options a few times
        games_pull_card:
            policy: sliding_window
            limit: 20
            interval: '10 minutes'
