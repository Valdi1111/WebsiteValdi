framework:
    http_client:
        scoped_clients:
            hoyoverse.hoyolab.client:
                scope: 'https://.*'
                timeout: 30 # Timeout in secondi (equivalente a 30000 ms)
                retry_failed:
                    max_retries: 3    # Corrisponde a retryAttempts
                    delay: 1000       # Attesa tra retry in ms (1 secondo)
                    http_codes: [ 429, 500, 502, 503, 504 ] # Errori su cui riprovare
                headers:
                    'Referer': 'https://act.hoyolab.com'
                    'x-rpc-app_version': '1.5.0'
                    'x-rpc-client_type': '5'
                    'x-rpc-language': 'en-us'
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36'
            hoyoverse.redeemable_codes.client:
                base_uri: 'https://api.ennead.cc'
