services:
    php-fpm:
        build:
            context: .
            dockerfile: ./docker/php/Dockerfile
        # Run as the host user, so that the mounted project stays writable on both sides
        # (see docs/DOCKER_DEV_SETUP.md for other ids, Docker rootless included)
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        environment:
            HOME: /tmp
            COMPOSER_HOME: /tmp/composer
        volumes:
            - ./:/var/www/html
            - composer-cache:/tmp/composer
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - backend
    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: "!ChangeMe!"
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 20s
        volumes:
            - mysql-data:/var/lib/mysql
        ports:
            - "127.0.0.1:3306:3306"
        networks:
            - backend
    mercure:
        # Caddy + Mercure, the binary scripts/setup-server.sh installs: hub and application, as on the server
        image: dunglas/mercure:v1.1.6
        restart: unless-stopped
        # The files Symfony reads: DOMAIN_NAME and MERCURE_JWT_SECRET come from .env.local
        env_file:
            - path: .env
            - path: .env.local
              required: false
        environment:
            # Also used by "ports" below, which Compose interpolates from the shell (never from .env.local)
            HTTPS_PORT: "${HTTPS_PORT:-8443}"
        volumes:
            - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - ./:/var/www/html:ro          # same path as php-fpm, for php_fastcgi
            - mercure_data:/data           # also holds Caddy's local CA
            - mercure_config:/config
        ports:
            - "127.0.0.1:${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
        depends_on:
            - php-fpm
        networks:
            - backend
    webpack:
        working_dir: /app
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        environment:
            HOME: /tmp
        build:
            context: .
            dockerfile: ./docker/webpack/Dockerfile
        volumes:
            - ./:/app
            - /app/node_modules

volumes:
    mysql-data:
        name: "website-valdi-mysql"
    mercure_data:
        name: "website-valdi-mercure-data"
    mercure_config:
        name: "website-valdi-mercure-config"
    composer-cache:
        name: "website-valdi-composer-cache"

networks:
    backend:
        name: "backend"
        driver: bridge
