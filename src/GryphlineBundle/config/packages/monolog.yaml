monolog:
    channels:
        - gryphline
        - gryphline.ake

when@prod:
    monolog:
        handlers:
            gryphline_file:
                type: stream
                path: '%kernel.logs_dir%/gryphline.log'
                level: debug
                channels: ['gryphline']
            gryphline_ake_file:
                type: stream
                path: '%kernel.logs_dir%/gryphline-arknights-endfield.log'
                level: debug
                channels: ['gryphline.ake']
