framework:
    http_client:
        scoped_clients:
            # Discord API, today for linking the account (DiscordOAuthClient). Relative paths without the leading
            # slash, so that they keep the version: "users/@me", not "/users/@me"
            discord.client:
                base_uri: 'https://discord.com/api/v10/'
                timeout: 10
            # Discord API as the bot of the application (DISCORD_BOT_TOKEN), only to sync the slash commands
            # (chat:commands:sync). The answers to the interactions go through discord.client: their token is in the URL
            discord.bot.client:
                base_uri: 'https://discord.com/api/v10/'
                timeout: 10
                headers:
                    Authorization: 'Bot %env(DISCORD_BOT_TOKEN)%'
            # OpenID Connect of Telegram, for linking the account (TelegramOAuthClient): "token" and
            # ".well-known/jwks.json". The bot messages go through the notifier transport instead
            telegram.oauth.client:
                base_uri: 'https://oauth.telegram.org/'
                # Short and retried: from some networks a connection to this host is now and then lost (seen in
                # development, about one in four), while an answer takes 0.1 s
                timeout: 5
                retry_failed:
                    # Transport errors only, also for the POST of the code exchange: when the first attempt did reach
                    # Telegram, the retry is refused as "invalid_grant", the failure there would have been anyway
                    http_codes:
                        - { code: 0, methods: [] }
                    max_retries: 2
                    delay: 200
    messenger:
        failure_transport: core_failed
        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            core_failed: '%env(MESSENGER_TRANSPORT_DSN)%?queue_name=failed'
            core_async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: core_async
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            # Chat commands and button presses (Discord, Telegram) run here, on workers of their own so that an answer
            # never waits behind the reminders. No retry: a Discord interaction token lasts 15 minutes, and the handlers
            # always close the deferred answer themselves
            core_chat:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: core_chat
                retry_strategy:
                    max_retries: 0
        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: core_async
            Symfony\Component\Notifier\Message\ChatMessage: core_async
            Symfony\Component\Notifier\Message\SmsMessage: core_async

