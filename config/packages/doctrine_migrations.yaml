doctrine_migrations:
    migrations_paths:
        # namespace is arbitrary but should be different from App\Migrations
        # as migrations classes should NOT be autoloaded
        'DoctrineMigrations': '%kernel.project_dir%/migrations'
    enable_profiler: false
    # MySQL commits implicitly on DDL (CREATE, ALTER, DROP...), so a migration wrapped in a transaction finds it already
    # committed, which doctrine/migrations deprecates. With this, make:migration and doctrine:migrations:generate add
    # isTransactional() returning false to every new migration. A migration with data changes only (no DDL) must drop
    # that override, so its statements stay atomic: MigrationsTransactionalModeTest checks both cases for every
    # migration. all_or_nothing must stay off: it refuses non-transactional migrations.
    transactional: false
