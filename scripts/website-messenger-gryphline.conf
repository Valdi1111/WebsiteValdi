;/etc/supervisor/conf.d/website-messenger-gryphline.conf
[program:website-messenger-gryphline]
command=php bin/console messenger:consume gryphline -vv --limit=100 --time-limit=3600
directory=/path/to/your/app
startsecs=0
autostart=true
autorestart=true
startretries=10
user=www-data
umask=0002
redirect_stderr=true
stdout_logfile=/path/to/your/app/var/log/%(program_name)s.log
