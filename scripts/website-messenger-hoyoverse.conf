;/etc/supervisor/conf.d/website-messenger-hoyoverse.conf
[program:website-messenger-hoyoverse]
command=php bin/console messenger:consume hoyoverse -vv --limit=5
directory=/path/to/your/app
startsecs=0
autostart=true
autorestart=true
startretries=10
user=www-data
umask=0002
redirect_stderr=true
stdout_logfile=/path/to/your/app/var/log/%(program_name)s.log