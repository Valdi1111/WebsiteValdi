framework:
    rate_limiter:
        # Current passwords tried on the profile page (UserPasswordManager::change()), per user; reset on success
        core_password_change:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # "Forgot password" submissions (ResetPasswordController::request()), per client IP. Each account also gets
        # at most one link per throttle_limit (config/packages/reset_password.yaml)
        core_password_reset_request:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
