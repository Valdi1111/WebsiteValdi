framework:
    cache:
        # Namespaced pools use the above "app" backend by default
        pools:
            gryphline.auth_session.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 600
            gryphline.item_icons.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 86400
            gryphline.pull_import_status.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 3600
            # Raw game notes payload per game profile (NotesTrait::getNotes()), shared by reminders and data getters
            gryphline.notes.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 300
            # Raw SKPort attendance per game profile (read only, never claims), cleared by a successful check-in
            gryphline.check_in_status.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 600
            # Compact Endfield operator and weapon catalog: rebuilt by gryphline:ake-catalog:update, never expires
            gryphline.ake_catalog.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 0

