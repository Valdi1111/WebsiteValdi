security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\CoreBundle\Entity\User
                property: email
    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # Discord interactions (slash commands, buttons): authenticated by their Ed25519 signature
        # (DiscordInteractionValueResolver), never by the session or the remember-me cookie, which they must not touch
        discord_interactions:
            pattern: ^/discord/interactions$
            security: false
        # Requests carrying an API token ("Authorization: Bearer <token>"): logged in by the token at every request and
        # never kept in the session, so that a disabled or deleted token stops at once and the session of a browser
        # is left alone. The login is marked as made with an API token (ApiTokenAuthenticationListener).
        api_token:
            request_matcher: App\CoreBundle\Security\BearerTokenRequestMatcher
            stateless: true
            provider: app_user_provider
            # Refuses the disabled accounts
            user_checker: App\CoreBundle\Security\UserChecker
            access_token:
                token_handler: App\CoreBundle\Security\AccessTokenHandler
            entry_point: App\CoreBundle\Security\AuthenticationEntryPoint
            access_denied_handler: App\CoreBundle\Security\AccessDeniedHandler
        main:
            lazy: true
            provider: app_user_provider
            # Refuses the disabled accounts (form and remember-me logins)
            user_checker: App\CoreBundle\Security\UserChecker
            form_login:
                # "app_login" is the name of the route created previously
                login_path: core_login
                check_path: core_login
                enable_csrf: true
            logout:
                path: core_logout
            entry_point: App\CoreBundle\Security\AuthenticationEntryPoint
            access_denied_handler: App\CoreBundle\Security\AccessDeniedHandler
            remember_me:
                secret: '%kernel.secret%' # required
                lifetime: 604800 # 1 week in seconds
                # by default, the feature is enabled by checking a
                # checkbox in the login form (see below), uncomment the
                # following line to always enable it.
                #always_remember_me: true
                domain: '%domain_name%'
                token_provider:
                    doctrine: true
            login_throttling: true

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    role_hierarchy:

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
