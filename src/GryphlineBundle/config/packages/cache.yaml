framework:
    cache:
        # Namespaced pools use the above "app" backend by default
        pools:
            gryphline.auth_session.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 600
            gryphline.item_icons.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 86400
            gryphline.pull_import_status.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 3600
            # Compact Endfield operator and weapon catalog: rebuilt by gryphline:endfield-catalog:update, never expires
            gryphline.endfield_catalog.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 0

