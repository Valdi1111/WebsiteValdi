gryphline:
    domain_name: 'gryphline.%domain_name%'
    timezones:
        US_EU: 'Europe/Paris'
        SEA: 'Asia/Shanghai'
    tasks:
        skport_check_in:
            cron: '0 20 * * *'
        skport_missed_check_in:
            cron: '0 14 * * *'
        stamina:
            cron: '*/30 * * * *'
        dailies_reminder:
            cron: '0 21 * * *'
        weeklies_reminder:
            cron: '0 21 * * 0'
