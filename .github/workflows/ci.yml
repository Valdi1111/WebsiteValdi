name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4

            # Setup PHP 8.5 with required extensions and Composer (shared with the phpunit job)
            -   &setup-php
                name: Setup PHP 8.5
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    extensions: ctype, exif, iconv, imagick, openssl, mbstring, xml, curl, zip, intl, sodium
                    tools: composer:v2
                    coverage: none

            # Cache Composer packages before running composer install
            -   &composer-cache
                name: Cache Composer packages
                id: composer-cache
                uses: actions/cache@v4
                with:
                    path: vendor
                    key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
                    restore-keys: |
                        ${{ runner.os }}-php-

            # Install Composer dependencies (with dev packages: PHPUnit is one of them)
            -   &composer-install
                name: Install Composer dependencies
                run: composer install --no-interaction --prefer-dist

            # Setup Node.js 24.x
            -   name: Use Node.js 24.x
                uses: actions/setup-node@v4
                with:
                    node-version: 24.x

            # Install Node.js dependencies
            -   name: Install Node.js dependencies
                run: npm ci

            # Build del progetto con Webpack
            -   name: Build Webpack
                run: npm run build

    phpunit:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4

            -   *setup-php
            -   *composer-cache
            -   *composer-install

            # The suite needs no database and no secrets: it runs with the committed .env and .env.test.
            # A PHP warning or notice raised during a test, or a risky test, fails the job; deprecations do not
            # (most come from vendor packages).
            -   name: Run PHPUnit
                run: php bin/phpunit --fail-on-warning --fail-on-notice --fail-on-risky
