framework:
    cache:
        # Namespaced pools use the above "app" backend by default
        pools:
            hoyoverse.redemption_history.cache:
                adapter: cache.adapter.filesystem
            hoyoverse.auth_session.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 600
            hoyoverse.item_icons.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 86400
            hoyoverse.pull_import_status.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 3600
            # Raw game notes payload per game profile (NotesTrait::getNotes()), shared by reminders and data getters
            hoyoverse.notes.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 300
            # Raw battle record payloads per game profile and endgame request (endgames status and reminder)
            hoyoverse.endgames.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 1800
            # Raw HoYoLAB check-in info per game profile (read only, never claims), cleared by a successful check-in
            hoyoverse.check_in_status.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 600


