services:
    php-fpm:
        image: php-fpm
        build:
            context: .
            dockerfile: ./docker/php/Dockerfile
        # Run as the host user, so that the mounted project stays writable on both sides
        # (set HOST_UID and HOST_GID if your ids are not 1000)
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        environment:
            HOME: /tmp
            COMPOSER_HOME: /tmp/composer
        volumes:
            - ./:/var/www/html
        depends_on:
            - mysql
            - mercure
        networks:
            - backend
    apache-httpd:
        image: apache-httpd
        build:
            context: .
            dockerfile: ./docker/apache/Dockerfile
        volumes:
            - ./docker/apache/vhosts:/usr/local/apache2/conf/extra/docker
            - ./docker/apache/certs:/etc/ssl/certs
            - ./:/var/www/html
        ports:
            - "8443:443"
        depends_on:
            - php-fpm
        networks:
            - backend
    mysql:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: "!ChangeMe!"
        volumes:
            - mysql-data:/var/lib/mysql
        ports:
            - "3306:3306"
        networks:
            - backend
    mercure:
        # 1.x rejects the tokens issued by symfony/mercure here (it requires iss, aud and exp claims)
        image: dunglas/mercure:v0.24
        restart: unless-stopped
        environment:
            # Comment the following line to enable HTTPS
            SERVER_NAME: ":80"
            MERCURE_PUBLISHER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
            MERCURE_SUBSCRIBER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
            # Set the URL of your Symfony project (without trailing slash!) as value of the cors_origins directive
            #MERCURE_EXTRA_DIRECTIVES: |
            #    cors_origins http://127.0.0.1:8000
        volumes:
            - mercure_data:/data
            - mercure_config:/config
        ports:
            - "3000:80"
        networks:
            - backend
    webpack:
        image: webpack
        working_dir: /app
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        environment:
            HOME: /tmp
        build:
            context: .
            dockerfile: ./docker/webpack/Dockerfile
        volumes:
            - ./:/app
            - /app/node_modules

volumes:
    mysql-data:
        name: "website-valdi-mysql"
    mercure_data:
        name: "website-valdi-mercure-data"
    mercure_config:
        name: "website-valdi-mercure-config"

networks:
    backend:
        name: "backend"
        driver: bridge
