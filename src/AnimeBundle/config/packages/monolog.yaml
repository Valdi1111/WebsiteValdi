monolog:
    channels:
        - anime.cache
        - anime.aw_handler
        - anime.episode_downloader

when@prod:
    monolog:
        handlers:
            anime_cache_file:
                type: stream
                path: '%kernel.logs_dir%/anime-cache.log'
                level: debug
                channels: ['anime.cache']
            anime_aw_handler_file:
                type: stream
                path: '%kernel.logs_dir%/anime-aw-handler.log'
                level: debug
                channels: ['anime.aw_handler']
            anime_episode_downloader_file:
                type: stream
                path: '%kernel.logs_dir%/anime-episode-downloader.log'
                level: debug
                channels: ['anime.episode_downloader']
