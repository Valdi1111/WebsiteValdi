framework:
    messenger:
        transports:
            gryphline:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: gryphline
                retry_strategy:
                    max_retries: 3
                    delay: 10000
                    multiplier: 2
                    max_delay: 60000
        routing:
            'App\GryphlineBundle\Message\Batch\SkportCheckInBatchMessage': gryphline
            'App\GryphlineBundle\Message\Profile\SkportCheckInProfileMessage': gryphline
            'App\GryphlineBundle\Message\Batch\StaminaCheckBatchMessage': gryphline
            'App\GryphlineBundle\Message\Profile\StaminaCheckProfileMessage': gryphline
