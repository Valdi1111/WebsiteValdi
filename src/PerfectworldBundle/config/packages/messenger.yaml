framework:
    messenger:
        transports:
            # Scheduled tasks (NTE catalog update)
            perfectworld:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: perfectworld
                retry_strategy:
                    max_retries: 3
                    delay: 10000    # Initial backoff: 10s -> 20s -> 40s
                    multiplier: 2
                    max_delay: 60000
            # Manual pull backup imports (nte-exporter files)
            perfectworld_pulls:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: perfectworld_pulls
                retry_strategy:
                    max_retries: 3
                    delay: 60000    # Initial backoff: 1 minute
                    multiplier: 2
                    max_delay: 300000
